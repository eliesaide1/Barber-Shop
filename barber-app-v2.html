<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>FadeRoom — iPhone 17 Pro Max Prototype</title>
<style>
  /* ===== LIGHT (default) =====
     --accent      : gold used for FILLS (buttons, chips, rings)
     --accent-ink  : gold used for TEXT/ICONS — darker so it stays readable on light
     --on-accent   : text colour that sits on top of a gold fill */
  :root{
    --accent:#d19a2e;
    --accent-2:#a97c22;
    --accent-ink:#8a5a10;
    --accent-soft:rgba(209,154,46,.16);
    --on-accent:#1b1713;
    --bg:#f7f3ed;
    --surface:#ffffff;
    --surface-2:#f2ede5;
    --surface-3:#e7e0d5;
    --text:#1b1713;
    --muted:#6b6055;         /* 5.2:1 on --surface-2 — keeps seg/labels readable */
    --line:#e5ded3;
    --danger:#c0392b;
    --page:
      radial-gradient(1200px 600px at 15% -10%, #fbeed3 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 20%, #f7e6e2 0%, transparent 50%),
      #ece4d8;
    --stage-t:#2a2219;
    --stage-s:#7a6f62;
    --hero-1:#fdf3e0;
    --hero-2:#fbeee7;
    --hero-line:#ecd9b0;
    --tabbar-bg:rgba(255,255,255,.9);
    --toast-bg:#221d17;
    --toast-fg:#f7f3ed;
    --home-ind:rgba(0,0,0,.32);
    --badge-ok-bg:rgba(47,111,67,.12);   --badge-ok-fg:#2f6f43;
    --badge-warn-bg:rgba(176,116,0,.14); --badge-warn-fg:#8a5a00;
    --badge-gold-bg:rgba(209,154,46,.2); --badge-gold-fg:#7f5410;
    --badge-red-bg:rgba(192,57,43,.1);   --badge-red-fg:#b03024;
    --radius:18px;
  }

  /* ===== DARK ===== */
  :root[data-theme="dark"]{
    --accent:#d9a441;        /* barber gold */
    --accent-2:#e9cf9a;
    --accent-ink:#d9a441;
    --accent-soft:rgba(217,164,65,.10);
    --on-accent:#0d0c0b;
    --bg:#0d0c0b;
    --surface:#171512;
    --surface-2:#201d19;
    --surface-3:#2a2621;
    --text:#f5f1ea;
    --muted:#9a8f80;
    --line:#2b2721;
    --danger:#e05c5c;
    --page:
      radial-gradient(1200px 600px at 15% -10%, #2b2013 0%, transparent 55%),
      radial-gradient(1000px 700px at 110% 20%, #2a1618 0%, transparent 50%),
      #08070a;
    --stage-t:#f3ead9;
    --stage-s:#8d8071;
    --hero-1:#2b2113;
    --hero-2:#231617;
    --hero-line:#463a22;
    --tabbar-bg:rgba(13,12,11,.85);
    --toast-bg:#f4efe6;
    --toast-fg:#0d0c0b;
    --home-ind:rgba(255,255,255,.55);
    --badge-ok-bg:rgba(233,207,154,.15); --badge-ok-fg:#e9cf9a;
    --badge-warn-bg:rgba(255,196,0,.15); --badge-warn-fg:#ffcf4a;
    --badge-gold-bg:rgba(217,164,65,.15);--badge-gold-fg:#d9a441;
    --badge-red-bg:rgba(224,92,92,.15);  --badge-red-fg:#e05c5c;
  }

  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,sans-serif;
    background:var(--page);
    min-height:100dvh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:20px 16px;
    color:var(--text);
    overflow:hidden;
  }

  /* ===== Stage layout ===== */
  .stage{display:flex;flex-direction:column;align-items:center;gap:18px}

  /* Scales the whole device down to fit the viewport, keeping exact proportions.
     --scale is set by fitDevice() on load + resize. */
  .device-wrap{
    position:relative;flex:0 0 auto;
    width:calc(440px * var(--scale,1));
    height:calc(952px * var(--scale,1));
  }
  .stage-title{text-align:center;color:var(--stage-t)}
  .stage-title h1{font-size:20px;letter-spacing:.2px;font-weight:700}
  .stage-title p{color:var(--stage-s);font-size:13px;margin-top:4px}
  .stage-title .pill{display:inline-block;margin-top:10px;font-size:11px;color:var(--on-accent);background:var(--accent);padding:4px 10px;border-radius:999px;font-weight:700}
  .stage-toggle{
    margin-top:10px;margin-inline-start:8px;font-size:11px;font-weight:700;cursor:pointer;
    color:var(--stage-t);background:transparent;border:1px solid var(--stage-s);
    padding:4px 10px;border-radius:999px;font-family:inherit;
  }
  .stage-toggle:hover{border-color:var(--accent);color:var(--accent-ink)}

  /* ===== iPhone 17 Pro Max ===== */
  .device{
    --w:440px;
    --h:952px;
    position:absolute;
    top:0;left:0;
    transform:scale(var(--scale,1));
    transform-origin:top left;
    width:var(--w);
    height:var(--h);
    border-radius:66px;
    background:linear-gradient(150deg,#3a3f42,#0d0f10 45%,#2a2f31 100%);
    padding:5px;
    box-shadow:
      0 0 0 2px #05070a,
      0 40px 90px -20px rgba(0,0,0,.85),
      inset 0 0 3px rgba(255,255,255,.25);
  }
  .device::before{ /* titanium rail highlight */
    content:"";position:absolute;inset:2px;border-radius:63px;
    padding:1px;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 30%,transparent 70%,rgba(255,255,255,.18));
    -webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);
    -webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none;
  }
  /* side buttons */
  .btn-side{position:absolute;background:linear-gradient(#2a2f31,#15181a);border-radius:3px}
  .btn-side.action{left:-3px;top:150px;width:4px;height:34px}
  .btn-side.vol-up{left:-3px;top:210px;width:4px;height:60px}
  .btn-side.vol-dn{left:-3px;top:288px;width:4px;height:60px}
  .btn-side.power{right:-3px;top:230px;width:4px;height:96px}

  .bezel{
    position:relative;width:100%;height:100%;
    border-radius:61px;background:#000;overflow:hidden;
  }

  .viewport{
    position:absolute;inset:0;border-radius:61px;overflow:hidden;
    background:var(--bg);display:flex;flex-direction:column;
  }

  /* Dynamic Island */
  .island{
    position:absolute;top:11px;left:50%;transform:translateX(-50%);
    width:126px;height:35px;background:#000;border-radius:20px;z-index:60;
    display:flex;align-items:center;justify-content:flex-end;gap:8px;padding-right:12px;
  }
  .island .cam{width:11px;height:11px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#243b52,#000 70%);box-shadow:inset 0 0 2px #4a6b8a}

  /* Status bar */
  .statusbar{
    height:54px;flex:0 0 54px;display:flex;align-items:flex-end;justify-content:space-between;
    padding:0 30px 8px;font-size:15px;font-weight:600;z-index:40;position:relative;color:var(--text);
  }
  .statusbar .icons{display:flex;align-items:center;gap:7px}
  .statusbar svg{display:block}

  /* App body */
  .app{flex:1;position:relative;overflow:hidden;display:flex;flex-direction:column}
  .screens{flex:1;position:relative;overflow:hidden}
  .screen{
    position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;
    padding:6px 20px 26px;opacity:0;visibility:hidden;transform:translateX(14px);
    transition:opacity .28s ease,transform .28s ease;
    -webkit-overflow-scrolling:touch;
  }
  .screen::-webkit-scrollbar{width:0}
  .screen.active{opacity:1;visibility:visible;transform:none}

  /* Home indicator */
  .home-indicator{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:135px;height:5px;border-radius:3px;background:var(--home-ind);z-index:55}

  /* ===== Typography / components ===== */
  h2.screen-title{font-size:26px;font-weight:800;letter-spacing:-.4px}
  .sub{color:var(--muted);font-size:13px}
  .row{display:flex;align-items:center;gap:12px}
  .between{justify-content:space-between}
  .mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}.mt24{margin-top:24px}
  .grow{flex:1}
  .muted{color:var(--muted)}
  .accent{color:var(--accent-ink)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
  .chip{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);font-size:13px;color:var(--text);cursor:pointer;white-space:nowrap;transition:.15s}
  .chip.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent);font-weight:700}
  .chip-scroll{display:flex;gap:9px;overflow-x:auto;padding:2px 0 4px;margin:0 -20px;padding-left:20px;padding-right:20px}
  .chip-scroll::-webkit-scrollbar{display:none}

  .btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:16px;border-radius:15px;border:none;background:var(--accent);color:var(--on-accent);font-size:16px;font-weight:700;cursor:pointer;transition:.15s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .btn.secondary{background:var(--surface-2);color:var(--text);border:1px solid var(--line)}
  .btn.ghost{background:transparent;color:var(--accent-ink);border:1px solid var(--line)}
  .btn.danger{background:transparent;color:var(--danger);border:1px solid rgba(224,92,92,.4)}

  .field{margin-top:14px}
  .field label{display:block;font-size:12.5px;color:var(--muted);margin-bottom:7px;font-weight:600}
  .input{width:100%;padding:15px 14px;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);font-size:15px;outline:none;transition:.15s}
  .input:focus{border-color:var(--accent)}
  .input.err{border-color:var(--danger)}
  .err-msg{color:var(--danger);font-size:12px;margin-top:6px;display:none}
  .err-msg.show{display:block}
  textarea.input{resize:none;min-height:80px;font-family:inherit}

  .avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent-2));color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:800;flex:0 0 auto}

  .thumb{border-radius:14px;position:relative;overflow:hidden;background:#241f1a;display:flex;align-items:flex-end;color:#fff}
  .thumb .grad{position:absolute;inset:0}
  .thumb .dur{position:absolute;bottom:8px;right:8px;background:rgba(0,0,0,.65);padding:3px 7px;border-radius:7px;font-size:11px;font-weight:600;z-index:2}
  .thumb .fav{position:absolute;top:8px;right:8px;z-index:2;cursor:pointer;font-size:16px;background:rgba(0,0,0,.4);width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:2}
  .thumb .play span{width:44px;height:44px;border-radius:50%;background:rgba(255,255,255,.9);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:16px}
  .progressbar{position:absolute;bottom:0;left:0;height:4px;background:var(--accent);z-index:2}

  .list-item{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line)}
  .list-item:last-child{border-bottom:none}

  .checkbox{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);flex:0 0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .checkbox.done{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:800}
  .done-text{text-decoration:line-through;color:var(--muted)}

  .seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:4px;gap:4px}
  .seg button{flex:1;padding:10px;border:none;background:transparent;color:var(--muted);font-size:13px;font-weight:600;border-radius:9px;cursor:pointer}
  .seg button.active{background:var(--accent);color:var(--on-accent)}

  .stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;flex:1}
  .stat .n{font-size:22px;font-weight:800}
  .stat .l{font-size:11px;color:var(--muted);margin-top:2px}

  .badge{font-size:10.5px;font-weight:700;padding:3px 8px;border-radius:999px}
  .badge.warn{background:var(--badge-warn-bg);color:var(--badge-warn-fg)}
  .badge.ok{background:var(--badge-ok-bg);color:var(--badge-ok-fg)}
  .badge.gold{background:var(--badge-gold-bg);color:var(--badge-gold-fg)}
  .badge.dim{background:var(--surface-3);color:var(--muted)}
  .badge.red{background:var(--badge-red-bg);color:var(--badge-red-fg)}

  /* Bottom tab bar */
  .tabbar{
    flex:0 0 auto;display:flex;justify-content:space-around;align-items:center;
    padding:10px 14px 24px;background:var(--tabbar-bg);backdrop-filter:blur(18px);
    border-top:1px solid var(--line);position:relative;z-index:30;
  }
  .tab{display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);font-size:10.5px;font-weight:600;cursor:pointer;flex:1;transition:.15s}
  .tab svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:1.9}
  .tab.active{color:var(--accent-ink)}

  /* Base header — every screen gets one; sticks to the top while the screen scrolls */
  .basehead{
    position:sticky;top:0;z-index:25;
    display:flex;align-items:center;gap:12px;
    margin:0 -20px 2px;padding:8px 20px 12px;
    background:var(--bg);
  }
  .basehead::after{
    content:"";position:absolute;left:0;right:0;bottom:-14px;height:14px;
    background:linear-gradient(var(--bg),transparent);pointer-events:none;
  }
  .basehead .bh-t{font-size:21px;font-weight:800;letter-spacing:-.3px;line-height:1.15}
  .basehead .bh-s{font-size:11.5px;color:var(--muted);margin-top:2px}
  .back-btn{flex:0 0 auto;width:40px;height:40px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text);transition:.15s}
  .back-btn:active{transform:scale(.92);background:var(--surface-3)}
  .back-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:2.2}

  .icon-btn{width:42px;height:42px;border-radius:12px;background:var(--surface-2);border:1px solid var(--line);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--text)}
  .icon-btn svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.9}

  /* OTP */
  .otp{display:flex;gap:10px;justify-content:space-between;margin-top:8px}
  .otp input{width:100%;aspect-ratio:1;text-align:center;font-size:24px;font-weight:700;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);color:var(--text);outline:none}
  .otp input:focus{border-color:var(--accent)}

  /* role picker */
  .role-card{flex:1;padding:16px;border-radius:15px;border:1px solid var(--line);background:var(--surface-2);text-align:center;cursor:pointer;transition:.15s}
  .role-card.active{border-color:var(--accent);background:var(--accent-soft)}
  .role-card .role-ico{width:30px;height:30px;stroke:var(--text);fill:none;stroke-width:1.8;display:block;margin:0 auto}
  .role-card.active .role-ico{stroke:var(--accent-ink)}
  .role-card .t{font-weight:700;margin-top:8px;font-size:14px}
  .role-card .d{font-size:11px;color:var(--muted);margin-top:2px}

  /* toast */
  .toast{position:absolute;bottom:96px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--toast-bg);color:var(--toast-fg);padding:12px 18px;border-radius:14px;font-size:13.5px;font-weight:600;opacity:0;transition:.3s;z-index:80;box-shadow:0 10px 30px rgba(0,0,0,.4);white-space:nowrap;pointer-events:none}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  /* modal sheet */
  .sheet-wrap{position:absolute;inset:0;z-index:70;display:none}
  .sheet-wrap.open{display:block}
  .sheet-back{position:absolute;inset:0;background:rgba(0,0,0,.55)}
  .sheet{position:absolute;left:0;right:0;bottom:0;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 20px 30px;transform:translateY(100%);transition:.32s cubic-bezier(.2,.8,.2,1);max-height:82%;overflow-y:auto}
  .sheet-wrap.open .sheet{transform:none}
  .grab{width:44px;height:5px;border-radius:3px;background:var(--line);margin:6px auto 14px}

  .divider{height:1px;background:var(--line);margin:16px 0}
  .kv{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px}
  .kv:last-child{border-bottom:none}
  .kv .k{color:var(--muted)}

  .day{flex:0 0 auto;width:52px;text-align:center;padding:10px 0;border-radius:13px;background:var(--surface-2);border:1px solid var(--line);cursor:pointer}
  .day.active{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .day.off{opacity:.35;cursor:not-allowed}
  .day .dn{font-size:11px;font-weight:600;opacity:.7}
  .day .dd{font-size:17px;font-weight:800;margin-top:2px}

  .slot-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:12px}
  .slot{padding:12px 4px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);text-align:center;font-size:13.5px;font-weight:600;cursor:pointer;transition:.15s}
  .slot.taken{opacity:.3;text-decoration:line-through;cursor:not-allowed}
  .slot.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent-ink)}

  .fab{position:absolute;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-size:26px;box-shadow:0 12px 24px rgba(217,164,65,.3);cursor:pointer;z-index:20}

  .hidden{display:none!important}

  .search-in{display:flex;align-items:center;gap:10px;background:var(--surface-2);border:1px solid var(--line);border-radius:13px;padding:0 14px}
  .search-in input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-size:15px;padding:14px 0}
  .search-in svg{width:18px;height:18px;stroke:var(--muted);fill:none;stroke-width:2}

  .ring{width:120px;height:120px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto}
  .ring .inner{width:92px;height:92px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}

  /* barber pole accent stripe */
  .pole{height:4px;border-radius:2px;background:repeating-linear-gradient(115deg,var(--accent) 0 8px,var(--bg) 8px 16px,#d15c5c 16px 24px,var(--bg) 24px 32px)}

  /* themed hero card (next appointment) */
  .hero{background:linear-gradient(135deg,var(--hero-1),var(--hero-2));border-color:var(--hero-line)}

  .timeline-item{display:flex;gap:12px;padding:0 0 4px}
  .timeline-time{width:56px;flex:0 0 auto;font-size:12.5px;font-weight:700;color:var(--muted);padding-top:16px}
  .timeline-body{flex:1;padding-bottom:12px;border-left:1px solid var(--line);padding-left:14px;position:relative}
  .timeline-body::before{content:"";position:absolute;left:-4.5px;top:20px;width:8px;height:8px;border-radius:50%;background:var(--line)}
  .timeline-item.on .timeline-body::before{background:var(--accent);box-shadow:0 0 0 4px rgba(217,164,65,.18)}

  .rating{color:var(--accent-ink);font-size:12px;font-weight:700}

  /* ===== QR check-in / loyalty ===== */
  /* Raised centre tab — the scan action is the primary in-shop gesture */
  .tab.cta{position:relative}
  .tab.cta>span{margin-top:30px}
  .cta-bubble{
    position:absolute;top:-22px;left:50%;transform:translateX(-50%);
    width:52px;height:52px;border-radius:50%;
    background:linear-gradient(135deg,var(--accent),var(--accent-2));
    color:var(--on-accent);display:flex;align-items:center;justify-content:center;
    border:4px solid var(--tabbar-bg);box-shadow:0 10px 22px rgba(209,154,46,.4);
  }
  .cta-bubble svg{width:25px;height:25px;stroke:currentColor;fill:none;stroke-width:2}
  .tab.cta.active .cta-bubble{box-shadow:0 0 0 3px var(--accent-soft),0 10px 22px rgba(209,154,46,.5)}

  /* Punch card */
  .punch{display:flex;gap:8px}
  .punch-slot{
    flex:1;aspect-ratio:1/1;border-radius:50%;border:2px dashed var(--line);
    background:var(--surface-2);color:var(--muted);
    display:flex;align-items:center;justify-content:center;font-weight:800;font-size:15px;
  }
  .punch-slot.on{background:var(--accent);border:2px solid var(--accent);color:var(--on-accent)}
  .punch-slot.goal{border-style:solid;border-color:var(--accent);color:var(--accent-ink)}
  .punch-slot.goal.on{background:linear-gradient(135deg,var(--accent),var(--accent-2))}
  .punch-mini{display:flex;gap:4px;margin-top:6px}
  .punch-mini i{width:7px;height:7px;border-radius:50%;background:var(--surface-3)}

<script>

   FadeRoom prototype — barber shop, client + artist roles
   ========================================================= */
const screensEl = document.getElementById('screens');
let currentRole = 'client';

/* ---------- theme ---------- */
function currentTheme(){return document.documentElement.getAttribute('data-theme')||'light';}
function setTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  try{localStorage.setItem('faderoom-theme',t);}catch(e){/* file:// with storage disabled */}
  const btn=document.getElementById('stage-theme');
  if(btn)btn.textContent=t==='light'?'☾ Dark mode':'☀ Light mode';
  document.querySelectorAll('[data-theme-btn]').forEach(b=>b.classList.toggle('active',b.dataset.themeBtn===t));
}
function toggleTheme(){setTheme(currentTheme()==='light'?'dark':'light');}

/* ---------- toast ---------- */
let toastTimer;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1800);
}

/* ---------- bottom sheet ---------- */
function openSheet(html){
  document.getElementById('sheet-body').innerHTML=html;
  document.getElementById('sheet').classList.add('open');
}
function closeSheet(){document.getElementById('sheet').classList.remove('open');}
document.querySelectorAll('[data-close-sheet]').forEach(e=>e.addEventListener('click',closeSheet));

/* ---------- navigation ---------- */
const CLIENT_TABS=['home','book','scan','shop','profile'];
/* Client screens that keep the tab bar but aren't tabs themselves. */
const CLIENT_INNER=['appointments','search','loyalty','styles','product','cart','checkout','orders'];
const ARTIST_TABS=['ar-schedule','ar-clients','ar-checkin','ar-services','ar-portfolio'];
/* Screens with nowhere to go back to — they anchor each role's stack. */
const ROOT_SCREENS=['login','home','ar-schedule'];

let navStack=[], currentScreen=null;

function show(id,opts={}){
  if(opts.reset) navStack.length=0;
  else if(!opts.back && currentScreen && currentScreen!==id) navStack.push(currentScreen);
  currentScreen=id;

  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('scr-'+id);
  if(el){el.classList.add('active');el.scrollTop=0;}
  document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t.dataset.goto===id));
  const inClient=CLIENT_TABS.includes(id)||CLIENT_INNER.includes(id);
  const inArtist=ARTIST_TABS.includes(id);
  document.getElementById('tabbar-client').classList.toggle('hidden',!inClient);
  document.getElementById('tabbar-artist').classList.toggle('hidden',!inArtist);

  /* Camera + rotating-QR only run while their screen is on top */
  if(id==='scan')startScanner();else stopScanner();
  if(id==='ar-checkin')startShopQR();else stopShopQR();
}

/* Back arrow: retrace the stack, falling back to the role's home screen. */
function goBack(){
  closeSheet();
  const prev=navStack.pop();
  if(prev) show(prev,{back:true});
  else show(currentRole==='artist'?'ar-schedule':'home',{back:true});
}

function dayList(){
  const out=[],base=new Date();
  const dn=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  for(let i=0;i<7;i++){
    const d=new Date(base.getTime()+i*86400000);
    out.push({dn:i===0?'Today':dn[d.getDay()], dd:d.getDate(), wd:d.getDay(),
              label:i===0?'Today':dn[d.getDay()]+' '+d.getDate()});

  return out;
}
function slotTaken(day,i){return (i*3+day*5)%7<2;}
function fmt12(t){
  const [h,m]=t.split(':').map(Number);

/* =========================================================
   QR — minimal encoder (byte mode, ECC level L, versions 1–5)

   ========================================================= */
const QR=(function(){
  const EXP=new Array(512),LOG=new Array(256);
  for(let i=0,x=1;i<255;i++){EXP[i]=x;LOG[x]=i;x<<=1;if(x&0x100)x^=0x11d;}
  for(let i=255;i<512;i++)EXP[i]=EXP[i-255];
  const mul=(a,b)=>(a&&b)?EXP[LOG[a]+LOG[b]]:0;
  const DATA_CW=[19,34,55,80,108], ECC_CW=[7,10,15,20,26];

  /* Reed–Solomon */
  function gen(n){let g=[1];for(let i=0;i<n;i++){const ng=new Array(g.length+1).fill(0);
    for(let j=0;j<g.length;j++){ng[j]^=g[j];ng[j+1]^=mul(g[j],EXP[i]);}g=ng;}return g;}
  function ecc(data,n){const g=gen(n),r=new Array(n).fill(0);
    for(const d of data){const f=d^r[0];r.shift();r.push(0);
      for(let i=0;i<n;i++)r[i]^=mul(g[i+1],f);}return r;}

  function utf8(s){const o=[];for(const ch of s){const c=ch.codePointAt(0);
    if(c<128)o.push(c);
    else if(c<2048)o.push(192|c>>6,128|c&63);
    else if(c<65536)o.push(224|c>>12,128|(c>>6&63),128|c&63);
    else o.push(240|c>>18,128|(c>>12&63),128|(c>>6&63),128|c&63);}return o;}

  /* 15-bit BCH format info (ECC level L = 01) */
  const G15=0x537,G15M=0x5412;
  function bch(d){let x=d<<10;for(let i=14;i>=10;i--)if(x>>i&1)x^=G15<<(i-10);return((d<<10)|x)^G15M;}

  const MASKS=[
    (r,c)=>(r+c)%2===0,(r,c)=>r%2===0,(r,c)=>c%3===0,(r,c)=>(r+c)%3===0,
    (r,c)=>((r/2|0)+(c/3|0))%2===0,(r,c)=>(r*c)%2+(r*c)%3===0,
    (r,c)=>((r*c)%2+(r*c)%3)%2===0,(r,c)=>((r+c)%2+(r*c)%3)%2===0];

  /* Standard penalty rules — we render all 8 masks and keep the calmest */
  function penalty(m){
    const n=m.length;let p=0;
    for(let k=0;k<2;k++)for(let i=0;i<n;i++){let run=0,prev=-1;
      for(let j=0;j<n;j++){const v=k?m[j][i]:m[i][j];
        run=(v===prev)?run+1:1;prev=v;
        if(run===5)p+=3;else if(run>5)p++;}}
    for(let r=0;r<n-1;r++)for(let c=0;c<n-1;c++){const v=m[r][c];
      if(v===m[r][c+1]&&v===m[r+1][c]&&v===m[r+1][c+1])p+=3;}
    const pat=[1,0,1,1,1,0,1];
    for(let k=0;k<2;k++)for(let i=0;i<n;i++)for(let j=0;j+7<=n;j++){
      let hit=true;
      for(let t=0;t<7;t++)if((k?m[j+t][i]:m[i][j+t])!==pat[t]){hit=false;break;}
      if(!hit)continue;
      let clearBefore=true,clearAfter=true;
      for(let t=1;t<=4;t++){const q=j-t;if(q<0)break;if(k?m[q][i]:m[i][q]){clearBefore=false;break;}}
      for(let t=0;t<4;t++){const q=j+7+t;if(q>=n)break;if(k?m[q][i]:m[i][q]){clearAfter=false;break;}}
      if(clearBefore||clearAfter)p+=40;}
    let dark=0;for(let r=0;r<n;r++)for(let c=0;c<n;c++)dark+=m[r][c];
    p+=Math.floor(Math.abs(dark*100/(n*n)-50)/5)*10;
    return p;
  }

  function encode(text){
    const by=utf8(String(text));
    let v=-1;
    for(let i=0;i<5;i++)if(by.length+2<=DATA_CW[i]){v=i;break;}
    if(v<0)return null;                              /* >106 bytes — out of range */
    const dcw=DATA_CW[v],ecw=ECC_CW[v],n=21+4*v;

    const bits=[],put=(x,l)=>{for(let i=l-1;i>=0;i--)bits.push(x>>i&1);};
    put(4,4);put(by.length,8);by.forEach(b=>put(b,8));
    for(let i=0;i<4&&bits.length<dcw*8;i++)bits.push(0);
    while(bits.length%8)bits.push(0);
    const cw=[];for(let i=0;i<bits.length;i+=8){let b=0;for(let j=0;j<8;j++)b=b<<1|bits[i+j];cw.push(b);}
    for(let i=0;cw.length<dcw;i++)cw.push(i%2?0x11:0xEC);
    const all=cw.concat(ecc(cw,ecw));

    const m=Array.from({length:n},()=>new Array(n).fill(0));
    const fx=Array.from({length:n},()=>new Array(n).fill(false));
    const set=(r,c,val)=>{if(r<0||c<0||r>=n||c>=n)return;m[r][c]=val;fx[r][c]=true;};

    const finder=(r0,c0)=>{for(let r=-1;r<=7;r++)for(let c=-1;c<=7;c++){
      const on=r>=0&&r<=6&&c>=0&&c<=6&&(r===0||r===6||c===0||c===6||(r>=2&&r<=4&&c>=2&&c<=4));
      set(r0+r,c0+c,on?1:0);}};
    finder(0,0);finder(0,n-7);finder(n-7,0);
    for(let i=8;i<n-8;i++){set(6,i,i%2?0:1);set(i,6,i%2?0:1);}
    if(v>0){const a=n-7;for(let r=-2;r<=2;r++)for(let c=-2;c<=2;c++)
      set(a+r,a+c,Math.max(Math.abs(r),Math.abs(c))===1?0:1);}
    for(let i=0;i<9;i++){if(!fx[8][i])set(8,i,0);if(!fx[i][8])set(i,8,0);}
    for(let i=0;i<8;i++){set(8,n-1-i,0);set(n-1-i,8,0);}
    set(n-8,8,1);                                    /* always-dark module */

    /* zigzag data placement, right to left, skipping the timing column */
    const tot=all.length*8;let bi=0,up=true;
    for(let col=n-1;col>0;col-=2){
      if(col===6)col--;
      for(let i=0;i<n;i++){
        const row=up?n-1-i:i;
        for(let k=0;k<2;k++){
          const c=col-k;
          if(fx[row][c])continue;
          m[row][c]=bi<tot?(all[bi>>3]>>(7-(bi&7))&1):0;
          bi++;
        }
      }
      up=!up;
    }

    let best=null,bestP=Infinity;
    for(let k=0;k<8;k++){
      const t=m.map(r=>r.slice());
      for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(!fx[r][c]&&MASKS[k](r,c))t[r][c]^=1;
      const f=bch(1<<3|k);
      for(let i=0;i<15;i++){
        const b=f>>i&1;
        if(i<6)t[i][8]=b;else if(i<8)t[i+1][8]=b;else t[n-15+i][8]=b;
        if(i<8)t[8][n-1-i]=b;else if(i===8)t[8][7]=b;else t[8][14-i]=b;
      }
      t[n-8][8]=1;
      const p=penalty(t);
      if(p<bestP){bestP=p;best=t;}
    }
    return best;
  }

  function svg(text){
    const m=encode(text);
    if(!m)return '<div class="sub" style="text-align:center;padding:20px">Code too long</div>';
    const n=m.length,q=4,S=n+q*2;let d='';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++)if(m[r][c])d+=`M${c+q} ${r+q}h1v1h-1z`;
    return `<svg viewBox="0 0 ${S} ${S}" shape-rendering="crispEdges" xmlns="http://www.w3.org/2000/svg">`+
           `<rect width="${S}" height="${S}" fill="#fff"/><path d="${d}" fill="#000"/></svg>`;
  }
  return {encode,svg};
})();

/* =========================================================
   LOYALTY — QR check-in, 5 visits = 1 free haircut

   How it is kept honest
   ─────────────────────
   1. The QR lives on the ARTIST's screen, never on a wall poster,
      and it ROTATES every 60s. A photo of it is worthless a minute
      later, so a scan proves "I'm standing at the chair, right now".
   2. The payload is signed with a shop secret, so nobody can hand-
      craft a valid code.
   3. One stamp per visit — a cooldown blocks scanning five times in
      a row. (Demo uses 20s; production would be ~4 hours.)
   4. Reaching 5 stamps mints a reward with a 6-character claim code
      and resets the counter to 0.
   5. Only the ARTIST can burn a reward: the client shows the code,
      the artist types it into their portal and confirms. The client
      can never mark their own free cut as used.
   ========================================================= */
const LOYALTY_GOAL=5;
const TOKEN_WINDOW=60000;      /* QR rotates every 60s                        */
const SCAN_COOLDOWN=20000;     /* demo: 20s · production: ~4h (one per visit) */
const SHOP_SECRET='faderoom-mar-mikhael';
const ARTIST_INDEX=0;          /* the artist portal is Karim's chair          */
const FREE_CUT_VALUE=25;

    {ts:Date.now()-86400000*40,barber:0},
    {ts:Date.now()-86400000*26,barber:1},
    {ts:Date.now()-86400000*13,barber:0},
  ],
  rewards:[{code:'K4M2QX',earnedAt:Date.now()-86400000*74,status:'redeemed',redeemedAt:Date.now()-86400000*70}],
  total:13,
  last:0,
};

/* what the artist sees roll in live */
let checkins=[
  {name:'Hadi Zgheib', barber:0, ts:Date.now()-3600000*2, kind:'stamp', n:4},
  {name:'Marc Aoun',   barber:0, ts:Date.now()-3600000*5, kind:'stamp', n:1},

function saveLoyalty(){try{localStorage.setItem('faderoom-loyalty',JSON.stringify(loyalty));}catch(e){}}

/* 32-bit FNV-1a → 6-character code. Stands in for an HMAC. */
function lhash(s){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}
  return (h>>>0).toString(36).toUpperCase().padStart(6,'0').slice(-6);}
function chkWindow(t){return Math.floor((t||Date.now())/TOKEN_WINDOW);}
function chkSig(barber,win){return lhash(SHOP_SECRET+'|C|'+barber+'|'+win);}
function chkToken(barber,win){return `FR1|C|${barber}|${win}|${chkSig(barber,win)}`;}
function rewardToken(code){return `FR1|R|${code}`;}

/* Accepts a full scanned token OR the 6-character fallback typed by hand. */
function validateCheckin(raw){
  raw=String(raw||'').trim();
  if(!raw)return{ok:false,why:'Enter the code under your artist’s QR'};
  const win=chkWindow();
  const p=raw.split('|');
  if(p.length===5&&p[0]==='FR1'&&p[1]==='C'){
    const b=+p[2],w=+p[3];
    if(!(w===win||w===win-1))return{ok:false,why:'That code expired — ask for a fresh one'};
    if(p[4]!==chkSig(b,w))return{ok:false,why:'That code isn’t from FadeRoom'};
    return{ok:true,barber:b};
  }
  const code=raw.toUpperCase();
  for(const w of [win,win-1])
    for(let b=0;b<barbers.length;b++)
      if(chkSig(b,w)===code)return{ok:true,barber:b};
  return{ok:false,why:'Code not recognised — check it and retry'};
}

function addStamp(barber,demo){
  const now=Date.now();
  if(!demo&&now-loyalty.last<SCAN_COOLDOWN)
    return{ok:false,why:'Already checked in for this visit'};
  loyalty.last=now;loyalty.total++;
  loyalty.stamps.push({ts:now,barber});
  checkins.unshift({name:'Elie Saide',barber,ts:now,kind:'stamp',n:loyalty.stamps.length});
  let reward=null;
  if(loyalty.stamps.length>=LOYALTY_GOAL){
    loyalty.stamps=[];
    reward={code:lhash(SHOP_SECRET+'|R|'+now+'|'+loyalty.total),earnedAt:now,status:'available'};
    loyalty.rewards.push(reward);
    checkins.unshift({name:'Elie Saide',barber,ts:now,kind:'earned',code:reward.code});
  }
  saveLoyalty();
  return{ok:true,reward,count:loyalty.stamps.length};
}

const availableReward=()=>loyalty.rewards.find(r=>r.status==='available');
const reservedReward =()=>loyalty.rewards.find(r=>r.status==='reserved');
const liveRewards    =()=>loyalty.rewards.filter(r=>r.status!=='redeemed');

/* Artist-side lookup. Takes a typed code or a scanned FR1|R| token. */
function findReward(input){
  let c=String(input||'').trim().toUpperCase();
  if(c.startsWith('FR1|R|'))c=c.split('|')[2]||'';
  if(!c)return{ok:false,why:'Enter the client’s claim code'};
  const r=loyalty.rewards.find(x=>x.code===c);
  if(!r)return{ok:false,why:'No free cut matches that code'};
  if(r.status==='redeemed')return{ok:false,why:'That free cut was already used'};
  return{ok:true,reward:r};
}
function burnReward(r){
  r.status='redeemed';r.redeemedAt=Date.now();delete r.appt;
  checkins.unshift({name:'Elie Saide',barber:ARTIST_INDEX,ts:Date.now(),kind:'redeemed',code:r.code});
  saveLoyalty();
}

function ago(ts){
  const m=Math.round((Date.now()-ts)/60000);
  if(m<1)return'just now';
  if(m<60)return m+' min ago';
  const h=Math.round(m/60);
  if(h<24)return h+'h ago';
  const d=Math.round(h/24);
  return d<14?d+'d ago':Math.round(d/7)+' wks ago';
}
function clientStamps(i){return i===0?loyalty.stamps.length:roster[i].stamps;}

function cartLine(id){return cart.find(l=>l.id===id);}
function cartCount(){return cart.reduce((t,l)=>t+l.qty,0);}
function cartSubtotal(){return cart.reduce((t,l)=>t+prod(l.id).p*l.qty,0);}
function deliveryFee(){return fulfil==='delivery'&&cartSubtotal()<FREE_DELIVERY_OVER?DELIVERY_FEE:0;}
function cartTotal(){return cartSubtotal()+deliveryFee();}

function shopList(){
  const q=shopFilter.q.trim().toLowerCase();
  return products.filter(p=>
    (shopFilter.cat==='All'||p.cat===shopFilter.cat)&&
    (!q||p.n.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q)
       ||p.cat.toLowerCase().includes(q)||sellerName(p.by).toLowerCase().includes(q)));
}

/* =========================================================
   SHARED PARTIALS
   ========================================================= */
function punchStrip(n){
  return `<div class="punch">${Array.from({length:LOYALTY_GOAL},(_,i)=>{
    const on=i<n, goal=i===LOYALTY_GOAL-1;
    return `<div class="punch-slot ${on?'on':''} ${goal?'goal':''}">${on?(goal?'🎁':'✂'):(goal?'🎁':i+1)}</div>`;
  }).join('')}</div>`;
}
function punchMini(n){
  return `<div class="punch-mini">${Array.from({length:LOYALTY_GOAL},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</div>`;
}
/* Artist's client row — stamp dots sit right under the name so the
   barber can see who is one cut away from a freebie. */
function rosterCard(c,i){
  const n=clientStamps(i), owed=i===0?liveRewards().length:0;
  return `<div class="card mt12" data-client="${i}" style="cursor:pointer">
    <div class="row">
      <div class="avatar" style="width:44px;height:44px;font-size:14px">${initials(c.n)}</div>
      <div class="grow">
        <div class="row" style="gap:7px"><span style="font-weight:700">${c.n}</span>${owed?`<span class="badge gold">🎁 ${owed} FREE CUT</span>`:''}</div>
        <div class="sub mt8">${c.fav}</div>
        <div class="row" style="gap:8px">${punchMini(n)}<span class="sub" style="font-size:10.5px;margin-top:6px">${n}/${LOYALTY_GOAL}</span></div>
      </div>
      <div style="text-align:right">
        <span class="badge ${c.status}">${c.tag}</span>
        <div class="sub" style="font-size:10px;margin-top:5px">${c.last}</div>
      </div>
    </div>
  </div>`;
}
function styleThumb(s,i,h=150){
  return `<div class="thumb" data-style="${i}" style="height:${h}px;background:${grads[i%grads.length]};cursor:pointer">
    <div class="grad" style="background:linear-gradient(to top,rgba(0,0,0,.6),transparent 60%)"></div>
    <div class="fav" data-fav="${i}">${s.fav?'♥':'♡'}</div>
    <div class="dur">${s.dur}</div>
    <div style="position:relative;z-index:2;padding:10px 12px">
      <div style="font-size:10px;opacity:.85;font-weight:600">${s.cat} · $${s.price}</div>
      <div style="font-size:14px;font-weight:700">${s.t}</div>
    </div>
  </div>`;
}
function initials(n){return n.split(' ').map(x=>x[0]).join('').slice(0,2);}
function stars(r){return '★'.repeat(Math.round(r))+'☆'.repeat(5-Math.round(r));}

/* Product tile. The whole card opens the product; the + is a shortcut
   straight into the cart, which is where most repeat buys will happen. */
function productCard(p){
  const i=products.indexOf(p), out=p.stock<=0, inCart=(cartLine(p.id)||{}).qty||0;
  return `<div class="prod" data-prod="${p.id}">
    <div class="prod-img" style="background:${grads[i%grads.length]}">
      <span>${p.ico}</span>
      ${out?'<div class="soldout">SOLD OUT</div>'
           :`${p.tag?`<span class="tag">${p.tag}</span>`:''}
             <div class="add" data-add="${p.id}">${inCart?inCart:'+'}</div>`}
    </div>
    <div class="prod-b">
      <div class="pn">${p.n}</div>
      <div class="pm">${p.size.split(' · ')[0]} · ${sellerName(p.by).split(' ')[0]}</div>
      <div class="row between mt8">
        <span class="pp">$${p.p}${p.was?`<s>$${p.was}</s>`:''}</span>
        <span class="rating" style="font-size:11px">★ ${p.rate}</span>
      </div>
    </div>
  </div>`;
}
function stepper(id,q,max){
  return `<div class="stepper">
    <button onclick="setQty('${id}',${q-1})" aria-label="Remove one">−</button>
    <span class="qv">${q}</span>
    <button onclick="setQty('${id}',${q+1})" ${q>=max?'disabled':''} aria-label="Add one">+</button>
  </div>`;
}
/* "Sold by" block — an artist's shelf links back to booking their chair. */
function sellerCard(by){
  if(by<0)return `<div class="card mt12"><div class="row">
    <div class="avatar" style="width:40px;height:40px;font-size:15px">✂</div>
    <div class="grow"><div style="font-weight:700;font-size:14px">FadeRoom house label</div>
      <div class="sub" style="margin-top:2px">Stocked by the shop · used at every chair</div></div></div></div>`;
  const b=barbers[by];
  return `<div class="card mt12" data-barber-card="${by}" style="cursor:pointer"><div class="row">
    <div class="avatar" style="width:40px;height:40px;font-size:13px">${initials(b.n)}</div>
    <div class="grow"><div style="font-weight:700;font-size:14px">From ${b.n}’s shelf</div>
      <div class="sub" style="margin-top:2px">${b.spec} · ★ ${b.rate}</div></div>
    <span style="color:var(--muted)">›</span></div></div>`;
}

/* =========================================================
   BUILD screens into DOM
   ========================================================= */
Object.keys(SCREENS).forEach(id=>{
  const div=document.createElement('div');
  div.className='screen';div.id='scr-'+id;div.innerHTML=SCREENS[id]();
  screensEl.appendChild(div);
});
/* Re-render a screen in place. Scroll position is restored, so refreshing a
   screen the user is reading (adding to cart, taking a stamp) doesn't throw
   them back to the top. show() still resets scroll on real navigation. */
function rebuild(id){
  const el=document.getElementById('scr-'+id);
  if(!el)return;
  const y=el.scrollTop;
  el.innerHTML=SCREENS[id]();
  if(y)el.scrollTop=y;
}

/* =========================================================
   AUTH
   ========================================================= */
screensEl.addEventListener('click',e=>{
  const rc=e.target.closest('[data-role]');
  if(rc){document.querySelectorAll('[data-role]').forEach(x=>x.classList.remove('active'));rc.classList.add('active');currentRole=rc.dataset.role;}
  const otpM=e.target.closest('[data-otp-method]');
  if(otpM){otpM.parentElement.querySelectorAll('button').forEach(b=>b.classList.remove('active'));otpM.classList.add('active');}
});
document.querySelectorAll('[data-tab]').forEach(t=>t.addEventListener('click',()=>show(t.dataset.goto)));

const isEmail=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
const isPhone=v=>/^[+]?[\d\s()-]{7,}$/.test(v);
function setErr(id,show){const i=document.getElementById(id);const e=document.getElementById(id+'-err');if(i)i.classList.toggle('err',show);if(e)e.classList.toggle('show',show);}

function doLogin(){
  const u=document.getElementById('li-user').value.trim();
  const p=document.getElementById('li-pass').value;
  let ok=true;
  if(!(isEmail(u)||isPhone(u))){setErr('li-user',true);ok=false;}else setErr('li-user',false);
  if(p.length<6){setErr('li-pass',true);ok=false;}else setErr('li-pass',false);
  if(!ok)return;
  enterApp();
}
function doRegister(){
  let ok=true;
  const name=document.getElementById('rg-name').value.trim();
  const email=document.getElementById('rg-email').value.trim();
  const phone=document.getElementById('rg-phone').value.trim();
  const pass=document.getElementById('rg-pass').value;
  setErr('rg-name',!name);if(!name)ok=false;
  setErr('rg-email',!isEmail(email));if(!isEmail(email))ok=false;
  setErr('rg-phone',!isPhone(phone));if(!isPhone(phone))ok=false;
  setErr('rg-pass',pass.length<6);if(pass.length<6)ok=false;
  if(!ok)return;
  rebuild('otp');
  document.getElementById('scr-otp').querySelector('#otp-dest').textContent=email;
  show('otp');initOtp();
}
function doForgot(){
  const u=document.getElementById('fg-user').value.trim();
  if(!(isEmail(u)||isPhone(u))){setErr('fg-user',true);return;}
  setErr('fg-user',false);
  rebuild('otp');
  document.getElementById('scr-otp').querySelector('#otp-dest').textContent=u;
  show('otp');initOtp();
}
function initOtp(){
  const inputs=[...document.querySelectorAll('#scr-otp .otp input')];
  inputs.forEach((inp,i)=>{
    inp.value='';
    inp.oninput=()=>{if(inp.value&&inputs[i+1])inputs[i+1].focus();};
    inp.onkeydown=e=>{if(e.key==='Backspace'&&!inp.value&&inputs[i-1])inputs[i-1].focus();};
  });
  inputs[0]&&inputs[0].focus();
}
function doVerifyOtp(){
  const code=[...document.querySelectorAll('#scr-otp .otp input')].map(i=>i.value).join('');
  if(code!=='1234'){toast('Invalid code — try 1234');return;}
  enterApp();
}
function enterApp(){
  if(currentRole==='artist'){rebuild('ar-schedule');show('ar-schedule',{reset:true});toast('Welcome back, Karim 💈');}
  else{rebuild('home');show('home',{reset:true});toast('Signed in ✓');}
}
function logout(){
  currentRole='client';rebuild('login');show('login',{reset:true});
  document.querySelectorAll('.tabbar').forEach(t=>t.classList.add('hidden'));toast('Logged out');
}

/* =========================================================

screensEl.addEventListener('click',e=>{
  const bc=e.target.closest('[data-barber-card]');
  if(bc){booking.barber=+bc.dataset.barberCard;booking.time=null;rebuild('book');show('book');return;}

  const bb=e.target.closest('[data-bk-barber]');
  if(bb){booking.barber=+bb.dataset.bkBarber;booking.time=null;rebuild('book');return;}

  const bs=e.target.closest('[data-bk-service]');
  if(bs){booking.service=+bs.dataset.bkService;rebuild('book');return;}

  const bd=e.target.closest('[data-bk-day]');
  if(bd){
    const days=dayList();const i=+bd.dataset.bkDay;
    if(barbers[booking.barber].off.includes(days[i].wd)){booking.day=i;booking.time=null;rebuild('book');return;}
    booking.day=i;booking.time=null;rebuild('book');return;
  }

  const bt=e.target.closest('[data-bk-time]');
  if(bt){booking.time=bt.dataset.bkTime;rebuild('book');return;}
});

function setPqty(q){
  const p=prod(viewProduct);if(!p)return;
  const inCart=(cartLine(p.id)||{}).qty||0;
  pqty=Math.max(1,Math.min(q,Math.max(1,p.stock-inCart)));

}

    :'<p class="sub" style="grid-column:1/3;text-align:center;padding:34px">Nothing matches that — try another category</p>';

function addToCart(id,qty){
  const p=prod(id);
  if(!p)return;
  if(p.stock<=0){toast('That one is sold out');return;}
  const line=cartLine(id), have=line?line.qty:0;
  const want=Math.min(have+(qty||1),p.stock);
  if(want===have){toast(`Only ${p.stock} in stock — already in your cart`);return;}
  if(line)line.qty=want;else cart.push({id,qty:want});
  pqty=1;
  saveShop();refreshShopUI();
  toast(`${p.n} added${want-have>1?' ×'+(want-have):''}`);
}
function setQty(id,q){
  const p=prod(id), line=cartLine(id);
  if(!p||!line)return;
  q=Math.max(0,Math.min(q,p.stock));
  if(q===0){cart=cart.filter(l=>l.id!==id);toast(`${p.n} removed`);}
  else line.qty=q;
  saveShop();refreshShopUI();
}

function placeOrder(){
  if(!cart.length){toast('Your cart is empty');return;}
  if(fulfil==='delivery'){
    let ok=true;
    const bad=(id,cond)=>{setErr(id,cond);if(cond)ok=false;};
    bad('ck-name',!ship.name.trim());
    bad('ck-phone',!isPhone(ship.phone.trim()));
    bad('ck-addr',ship.addr.trim().length<6);
    if(!ok){toast('Check your delivery details');return;}
  }
  const id=Date.now(), a=appts[0];
  const o={
    id, ts:id, code:orderCode(id), fulfil, pay:payMethod,
    items:cart.map(l=>{const p=prod(l.id);return {id:p.id,n:p.n,p:p.p,qty:l.qty,ico:p.ico};}),
    subtotal:cartSubtotal(), fee:deliveryFee(), total:cartTotal(),
    addr:fulfil==='delivery'?Object.assign({},ship):null,
    withAppt:!!(fulfil==='pickup'&&pickupWithAppt&&a),
    apptLabel:(fulfil==='pickup'&&pickupWithAppt&&a)?`${a.day} · ${a.time}`:null,
    status:fulfil==='delivery'?'packing':'ready',
  };
  /* Stock is shop-side data — the CMS will own it. Here it just moves so
     you can see the sold-out and low-stock states behave. */
  cart.forEach(l=>{const p=prod(l.id);p.stock=Math.max(0,p.stock-l.qty);});
  orders.unshift(o);
  cart=[];pickupWithAppt=false;
  saveShop();refreshShopUI();rebuild('checkout');
  /* Land on the order list, so dismissing the sheet doesn't drop the user
     back onto a checkout screen for an order they already placed. */
  show('orders',{reset:true});
  orderPlacedSheet(o);
}

/* Demo affordance — stands in for the artist marking the order handed over,
   which is what the CMS will do from the artist portal. */
function advanceOrder(id){
  const o=orders.find(x=>x.id===id);
  if(!o||!orderOpen(o))return;
  o.status=orderSteps(o)[orderStepIndex(o)+1][0];
  saveShop();refreshShopUI();
  closeSheet();orderSheet(id);
  toast(orderLabel(o));
}
function reorder(id){
  const o=orders.find(x=>x.id===id);
  if(!o)return;
  let skipped=0;
  o.items.forEach(it=>{
    const p=prod(it.id);
    if(!p||p.stock<=0){skipped++;return;}
    const line=cartLine(it.id), want=Math.min((line?line.qty:0)+it.qty,p.stock);
    if(line)line.qty=want;else cart.push({id:it.id,qty:want});
  });
  saveShop();closeSheet();refreshShopUI();show('cart');
  toast(skipped?`Added what’s in stock · ${skipped} unavailable`:'Added to your cart');
}

/* Every screen that prints a cart count or a stock figure, re-rendered in
   one place — and the shop search box put back the way the user left it. */
function refreshShopUI(){
  const act=document.activeElement;
  const keep=act&&act.id==='shop-q'?{pos:act.selectionStart}:null;
  ['home','shop','product','cart','orders','profile'].forEach(rebuild);
  syncCartBadges();
  if(keep){
    const el=document.getElementById('shop-q');
    if(el){el.focus();try{el.setSelectionRange(keep.pos,keep.pos);}catch(e){}}
  }
}
function syncCartBadges(){
  const n=cartCount();

/* =========================================================
   QR CHECK-IN — client side (camera)
   ========================================================= */
let camStream=null, camRAF=null, camDet=null, camLast=0, scanLock=0;

function scanHint(msg){const h=document.getElementById('scan-hint');if(h)h.textContent=msg;}

async function startScanner(){
  if(camStream)return;                                   /* idempotent */
  if(!document.getElementById('cam'))return;
  const canDetect='BarcodeDetector' in window;
  const slow=setTimeout(()=>scanHint('Waiting for camera permission…'),2500);
  try{
    const stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});
    clearTimeout(slow);
    /* The permission prompt is slow — the screen may have changed underneath us. */
    const v=document.getElementById('cam');
    if(currentScreen!=='scan'||!v){stream.getTracks().forEach(t=>t.stop());return;}
    camStream=stream;
    v.srcObject=stream;
    await v.play();
    if(canDetect){
      camDet=new BarcodeDetector({formats:['qr_code']});
      scanHint('Point at the code on your artist’s phone');
      camRAF=requestAnimationFrame(scanLoop);
    }else{
      scanHint('This browser can’t read QR codes — use the 6-character code below');
    }
  }catch(err){
    clearTimeout(slow);
    camStream=null;
    const box=document.getElementById('scanner');
    if(box)box.classList.add('nocam');
    scanHint('Camera unavailable — type the code below, or tap “Simulate a scan”');
  }
}
function stopScanner(){
  if(camRAF){cancelAnimationFrame(camRAF);camRAF=null;}
  if(camStream){camStream.getTracks().forEach(t=>t.stop());camStream=null;}
  camDet=null;
}
function scanLoop(){
  camRAF=requestAnimationFrame(scanLoop);
  const v=document.getElementById('cam');
  if(!v||!camDet||v.readyState<2)return;
  const now=performance.now();
  if(now-camLast<350)return;                             /* ~3 reads a second is plenty */
  camLast=now;
  camDet.detect(v).then(codes=>{
    if(codes.length)cameraScan(codes[0].rawValue);
  }).catch(()=>{});
}
/* Camera reads fire continuously, so swallow repeats for a moment. */
function cameraScan(raw){
  if(Date.now()<scanLock)return;
  scanLock=Date.now()+2500;
  doCheckin(raw);
}

/* =========================================================
   FIT THE DEVICE TO THE VIEWPORT
   Scales the 440×952 mockup down so it always sits fully on
   screen. On a real phone (<=500px) the CSS takes over and
   the app runs edge-to-edge instead.
   ========================================================= */
const DEVICE_W=440, DEVICE_H=952;
function fitDevice(){
  const root=document.documentElement;
  if(window.matchMedia('(max-width:500px)').matches){root.style.setProperty('--scale',1);return;}
  const title=document.querySelector('.stage-title');
  const titleH=title?title.offsetHeight+18:0;          /* + .stage gap */
  const availH=window.innerHeight-titleH-40;           /* - body padding */
  const availW=window.innerWidth-32;
  const s=Math.min(1, availH/DEVICE_H, availW/DEVICE_W);
  root.style.setProperty('--scale', Math.max(s,.3).toFixed(3));
}
window.addEventListener('resize',fitDevice);
window.addEventListener('orientationchange',fitDevice);
fitDevice();

/* live clock */
function tick(){const d=new Date();let h=d.getHours(),m=d.getMinutes();const c=document.getElementById('clock');if(c)c.textContent=h+':'+String(m).padStart(2,'0');}
setInterval(tick,10000);

let savedTheme='light';
try{savedTheme=localStorage.getItem('faderoom-theme')||'light';}catch(e){}
setTheme(savedTheme);
loadLoyalty();
loadShop();
['home','profile','loyalty','scan','ar-checkin','ar-clients','shop','product','cart','orders'].forEach(rebuild);
